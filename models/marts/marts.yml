version: 2

models:
  - name: dim_store
    description: SCD1 store dimension at one row per store.
    columns:
      - name: store_id
        tests: [not_null, unique]
      - name: store_type
        tests: [not_null]
      - name: store_size
        tests: [not_null]

  - name: dim_department
    description: SCD1 department dimension at one row per department.
    columns:
      - name: dept_id
        tests: [not_null, unique]

  - name: dim_date
    description: Date dimension at one row per source week date.
    columns:
      - name: date_id
        tests: [not_null, unique]
      - name: week_date
        tests: [not_null, unique]

  - name: fct_department_weekly_sales
    description: SCD2 department sales history. Streamlit reports should filter is_current = true.
    columns:
      - name: department_sales_version_key
        tests: [not_null, unique]
      - name: store_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_id
      - name: dept_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_department')
                field: dept_id
      - name: date_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_id
      - name: weekly_sales
        tests: [not_null]
      - name: is_current
        tests: [not_null]

  - name: fct_store_weekly_features
    description: SCD2 history of store economic and operational features at store-week grain.
    columns:
      - name: store_week_version_key
        tests: [not_null, unique]
      - name: store_week_key
        tests: [not_null]
      - name: store_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_id
      - name: date_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_id
      - name: is_current
        tests: [not_null]
